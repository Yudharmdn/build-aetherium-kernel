name: Build Kernel Poco F5

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Nama Kernel"
        required: false
        default: "Yudharn-Melt"
      defconfig:
        description: "Defconfig"
        required: false
        default: "marble_defconfig"
      nomount_commit:
        description: "NoMount commit/branch/tag (contoh: master, v1.0, abc1234)"
        required: false
        default: "master"
      susfs_branch:
        description: "Susfs branch"
        required: false
        default: "gki-android12-5.10"
      resukisu_branch:
        description: "ReSukiSU branch"
        required: false
        default: "main"
      rekernel_branch:
        description: "Re-Kernel branch"
        required: false
        default: "main"
      clean_build:
        description: "Bersihkan sebelum build?"
        required: false
        default: "true"

  push:
    branches: [ Yudharn-melt-rebase ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      KERNEL_NAME: ${{ github.event.inputs.kernel_name || 'Yudharn-Melt' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'marble_defconfig' }}

    steps:
      # -------------------------------------------------------
      # 1. CHECKOUT
      # -------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: Yudharn-melt-rebase
          submodules: recursive
          fetch-depth: 0
          path: kernel

      # -------------------------------------------------------
      # 2. SYSTEM DEPS
      # -------------------------------------------------------
      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache ca-certificates cpio curl \
            device-tree-compiler flex g++-multilib gcc-multilib git \
            gnupg gperf imagemagick jq kmod lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lz4 lzop openssh-client pngcrush \
            python-is-python3 python3 rsync schedtool squashfs-tools \
            texinfo u-boot-tools unzip wget xsltproc yasm zip zlib1g-dev

      # -------------------------------------------------------
      # 3. CLANG — VERSI STABIL (anti rate-limit)
      # -------------------------------------------------------
      - name: Detect latest LLVM release
        id: get_llvm
        run: |
          echo "Fetching latest LLVM tag..."
          LLVM_TAG=$(curl -sL --max-time 30 "https://api.github.com/repos/llvm/llvm-project/releases/latest" \
                     | jq -r '.tag_name // "llvmorg-17.0.6"')
          if [ -z "$LLVM_TAG" ] || [ "$LLVM_TAG" = "null" ]; then
            LLVM_TAG="llvmorg-17.0.6"
          fi
          LLVM_VER=$(echo "$LLVM_TAG" | sed 's/^llvmorg-//')
          echo "LLVM_TAG=$LLVM_TAG" >> $GITHUB_OUTPUT
          echo "LLVM_VER=$LLVM_VER" >> $GITHUB_OUTPUT
          echo "Using LLVM: $LLVM_TAG"

      - name: Download LLVM prebuilt
        id: dl_llvm
        run: |
          LLVM_TAG="${{ steps.get_llvm.outputs.LLVM_TAG }}"
          LLVM_VER="${{ steps.get_llvm.outputs.LLVM_VER }}"
          
          mkdir -p ${{ env.TOOLCHAIN_DIR }}/clang
          cd /tmp
          
          # Try multiple known good URLs
          URLS=(
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/clang+llvm-${LLVM_VER}-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/clang+llvm-${LLVM_VER}-x86_64-linux-gnu-ubuntu-20.04.tar.xz"
            "https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/clang+llvm-${LLVM_VER}-x86_64-linux-gnu.tar.xz"
          )
          
          DOWNLOADED=false
          for URL in "${URLS[@]}"; do
            echo "Trying: $URL"
            if curl -fsSL --max-time 300 -o /tmp/llvm.tar.xz "$URL" 2>/dev/null; then
              DOWNLOADED=true
              echo "SUCCESS: $URL"
              break
            fi
          done
          
          # Fallback ke versi yang terbukti stabil
          if [ "$DOWNLOADED" = false ]; then
            echo "Latest download failed, falling back to clang-r450784e..."
            curl -fsSL --max-time 300 -o /tmp/llvm.tar.xz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784e.tar.gz"
            tar -xzf /tmp/llvm.tar.xz -C ${{ env.TOOLCHAIN_DIR }}/clang
          else
            tar -xJf /tmp/llvm.tar.xz -C ${{ env.TOOLCHAIN_DIR }}/clang --strip-components=1
          fi
          
          rm -f /tmp/llvm.tar.xz
          ${{ env.TOOLCHAIN_DIR }}/clang/bin/clang --version

      # -------------------------------------------------------
      # 4. ANDROID GCC
      # -------------------------------------------------------
      - name: Install Android GCC
        run: |
          mkdir -p ${{ env.TOOLCHAIN_DIR }}/aarch64-linux-android-4.9
          cd ${{ env.TOOLCHAIN_DIR }}/aarch64-linux-android-4.9
          git clone --depth=1 -b android-5.10 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 .

      # -------------------------------------------------------
      # 5. SETUP ENV
      # -------------------------------------------------------
      - name: Setup environment
        run: |
          CLANG_DIR="${{ env.TOOLCHAIN_DIR }}/clang"
          GCC_DIR="${{ env.TOOLCHAIN_DIR }}/aarch64-linux-android-4.9"
          
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "GCC_DIR=$GCC_DIR" >> $GITHUB_ENV
          echo "PATH=$CLANG_DIR/bin:$GCC_DIR/bin:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "HOSTCC=clang" >> $GITHUB_ENV
          echo "HOSTCXX=clang++" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          
          echo "=== Toolchain versions ==="
          clang --version | head -1
          ${CROSS_COMPILE}gcc --version 2>/dev/null | head -1 || aarch64-linux-android-gcc --version | head -1

      # -------------------------------------------------------
      # 6. CCACHE
      # -------------------------------------------------------
      - name: Setup ccache
        run: |
          ccache -M 5G
          ccache -o compression=true
          ccache --version

      # -------------------------------------------------------
      # 7. ReSukiSU
      # -------------------------------------------------------
      - name: Apply ReSukiSU
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Applying ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.resukisu_branch || 'main' }}"

      # -------------------------------------------------------
      # 8. Susfs
      # -------------------------------------------------------
      - name: Apply Susfs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Cloning Susfs..."
          git clone --depth=1 -b "${{ github.event.inputs.susfs_branch || 'gki-android12-5.10' }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs
          
          cd susfs
          # Copy fs dan include
          if [ -d "fs" ]; then
            cp -rn fs/* ../fs/ 2>/dev/null || true
          fi
          if [ -d "include" ]; then
            cp -rn include/* ../include/ 2>/dev/null || true
          fi
          
          # Apply patches
          cd ..
          for patch_dir in susfs/kernel_patches susfs/patches; do
            if [ -d "$patch_dir" ]; then
              for patch in $patch_dir/*.patch; do
                [ -f "$patch" ] || continue
                echo "Applying: $patch"
                git apply --check "$patch" 2>/dev/null && git apply "$patch" || echo "  -> skipped (conflict/applied)"
              done
            fi
          done

      # -------------------------------------------------------
      # 9. NoMount
      # -------------------------------------------------------
      - name: Apply NoMount
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          NOMOUNT_REF="${{ github.event.inputs.nomount_commit || 'master' }}"
          echo "Applying NoMount (ref: $NOMOUNT_REF)..."
          
          # Clone repo
          git clone https://github.com/maxsteeel/nomount.git nomount
          cd nomount
          
          # Checkout ref spesifik (commit/branch/tag)
          if [ "$NOMOUNT_REF" != "master" ] && [ "$NOMOUNT_REF" != "main" ]; then
            git fetch --depth=1 origin "$NOMOUNT_REF" 2>/dev/null || git fetch origin "$NOMOUNT_REF"
            git checkout "$NOMOUNT_REF" 2>/dev/null || {
              echo "Ref $NOMOUNT_REF not found, using default branch"
            }
          fi
          
          cd ..
          
          # Run official setup script
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" \
            | bash -s master

      # -------------------------------------------------------
      # 10. Re-Kernel (Sakion)
      # -------------------------------------------------------
      - name: Apply Re-Kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "Cloning Re-Kernel..."
          git clone --depth=1 -b "${{ github.event.inputs.rekernel_branch || 'main' }}" \
            https://github.com/Sakion-Team/Re-Kernel.git re-kernel
          
          # Apply patches
          for patch_dir in re-kernel/patches re-kernel/kernel_patches; do
            if [ -d "$patch_dir" ]; then
              for patch in $patch_dir/*.patch; do
                [ -f "$patch" ] || continue
                echo "Applying: $patch"
                git apply --check "$patch" 2>/dev/null && git apply "$patch" || echo "  -> skipped"
              done
            fi
          done

      # -------------------------------------------------------
      # 11. DEFCONFIG
      # -------------------------------------------------------
      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Validasi defconfig
          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "ERROR: Defconfig not found: $DEFCONFIG_PATH"
            echo "Available defconfigs:"
            ls arch/arm64/configs/ | head -30
            exit 1
          fi
          
          echo "Using defconfig: $DEFCONFIG"
          
          # Tambah config flags untuk fitur kita
          cat >> "$DEFCONFIG_PATH" <<'EOF'
          # === KernelSU / ReSukiSU ===
          CONFIG_KSU=y
          CONFIG_KPM=y
          
          # === Susfs ===
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          
          # === NoMount ===
          CONFIG_NOMOUNT=y
          
          # === Re-Kernel (Netlink & eBPF) ===
          CONFIG_NETFILTER=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETLINK_NETFILTER=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          EOF
          
          # Clean (opsional)
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            make clean && make mrproper
          fi
          
          # Generate .config
          make ${DEFCONFIG}
          
          if [ ! -f .config ]; then
            echo "ERROR: .config not generated"
            exit 1
          fi
          echo "Config generated OK"

      # -------------------------------------------------------
      # 12. BUILD
      # -------------------------------------------------------
      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          source $GITHUB_ENV
          
          echo "=== Verifying toolchain ==="
          which clang
          clang --version | head -1
          which ${CROSS_COMPILE}gcc || ls $GCC_DIR/bin/ | head -5
          
          echo "=== Building kernel ==="
          make -j$(nproc) \
            CC="ccache clang" \
            CROSS_COMPILE="ccache ${CROSS_COMPILE}" \
            LLVM=1 2>&1 | tee build.log | tail -200
          
          BUILD_RESULT=${PIPESTATUS[0]}
          if [ $BUILD_RESULT -ne 0 ]; then
            echo "BUILD FAILED"
            exit $BUILD_RESULT
          fi
          echo "BUILD SUCCESS"

      # -------------------------------------------------------
      # 13. VERIFY & COPY OUTPUT
      # -------------------------------------------------------
      - name: Verify output
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          ls -lh arch/arm64/boot/
          
          # Copy semua output
          mkdir -p ${{ github.workspace }}/out
          
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ${{ github.workspace }}/out/
          fi
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ${{ github.workspace }}/out/
          fi
          if [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz ${{ github.workspace }}/out/
          fi
          
          # DTB
          if [ -d arch/arm64/boot/dts ]; then
            mkdir -p ${{ github.workspace }}/out/dtb
            find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ${{ github.workspace }}/out/dtb/ \; 2>/dev/null || true
          fi
          
          # SHA1
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "${{ github.workspace }}/out/$img" ]; then
              SHA1=$(sha1sum "${{ github.workspace }}/out/$img" | awk '{print $1}')
              echo "IMAGE_SHA1=$SHA1" >> $GITHUB_ENV
              echo "Selected: $img (SHA1: $SHA1)"
              break
            fi
          done
          
          ls -lh ${{ github.workspace }}/out/

      # -------------------------------------------------------
      # 14. ANYKERNEL3
      # -------------------------------------------------------
      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/yudharn/AnyKernel3.git ${{ github.workspace }}/AnyKernel3
          cd ${{ github.workspace }}/AnyKernel3
          
          # Set SHA1
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" anykernel.sh
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" AnyKernel3/anykernel.sh 2>/dev/null || true
          
          # Copy image
          for img in Image.gz-dtb Image.gz Image; do
            if [ -f "${{ github.workspace }}/out/$img" ]; then
              cp "${{ github.workspace }}/out/$img" zImage
              echo "Using: $img"
              break
            fi
          done
          
          # Copy DTB
          if [ -d "${{ github.workspace }}/out/dtb" ]; then
            cp -r ${{ github.workspace }}/out/dtb/* . 2>/dev/null || true
          fi
          
          # Update metadata
          sed -i "s|kernel.string=.*|kernel.string=${KERNEL_NAME} for Poco F5|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name1=.*|device.name1=marble|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name2=.*|device.name2=Poco F5|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name3=.*|device.name3=|" anykernel.sh 2>/dev/null || true
          
          rm -rf .git .github
          
          ZIP_NAME="${KERNEL_NAME}-PocoF5-marble-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "${{ github.workspace }}/$ZIP_NAME" . -x "*.git*" "*.zip" "README.md"
          cp "${{ github.workspace }}/$ZIP_NAME" ${{ github.workspace }}/out/
          ls -lh ${{ github.workspace }}/out/

      # -------------------------------------------------------
      # 15. UPLOAD
      # -------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-marble-${{ env.KERNEL_NAME }}-${{ github.run_id }}
          path: ${{ github.workspace }}/out/
          retention-days: 14
          if-no-files-found: warn
