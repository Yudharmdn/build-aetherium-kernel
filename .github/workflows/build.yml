name: 🚀 Build Kernel — Poco F5 (marble)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "📛 Nama Kernel (untuk zip)"
        required: false
        default: "Yudharn-Melt"
      defconfig:
        description: "⚙️ Defconfig"
        required: false
        default: "marble_defconfig"
      nomount_commit:
        description: "🪝 NoMount — commit / branch / tag"
        required: false
        default: "master"
      susfs_branch:
        description: "🛡️ Susfs branch"
        required: false
        default: "gki-android12-5.10"
      resukisu_branch:
        description: "🧩 ReSukiSU branch (main / dev / tag)"
        required: false
        default: "main"
      rekernel_branch:
        description: "🔗 Re-Kernel (Sakion) branch"
        required: false
        default: "main"
      clang_vendor:
        description: "🛠️ Clang vendor (null = auto ambil dari LLVM latest)"
        required: false
        default: "null"
      android_clang_version:
        description: "📦 Versi Android prebuilt clang (jika clang_vendor = aosp)"
        required: false
        default: "r530567"
      clean_build:
        description: "🧹 Bersihkan output sebelum build?"
        type: choice
        required: false
        default: "true"
        options:
          - "true"
          - "false"
      upload_anykernel3:
        description: "📦 Upload AnyKernel3 zip?"
        type: choice
        required: false
        default: "true"
        options:
          - "true"
          - "false"

  push:
    branches:
      - Yudharn-melt-rebase
    paths-ignore:
      - "**.md"
      - ".github/**"

jobs:
  build:
    name: 🔨 Build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        target: [clang]
        include:
          - target: clang

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      KERNEL_NAME: ${{ github.event.inputs.kernel_name || 'Yudharn-Melt' }}
      DEFCONFIG: ${{ github.event.inputs.defconfig || 'marble_defconfig' }}

    steps:
      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: 📥 Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: Yudharn-melt-rebase
          submodules: recursive
          fetch-depth: 0
          path: kernel

      # ============================================================
      # 2. SETUP SYSTEM
      # ============================================================
      - name: 🐧 Setup Ubuntu environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache ca-certificates cpio curl \
            device-tree-compiler flex g++-multilib gcc-multilib git \
            gnupg gperf imagemagick jq kmod lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils linux-libc-dev lz4 lzop openssh-client pngcrush \
            python-is-python3 python2 python3 rsync schedtool squashfs-tools \
            texinfo u-boot-tools unzip wget xsltproc yasm zip zlib1g-dev
          echo "✅ System packages installed"

      # ============================================================
      # 3. CLANG / LLVM — AUTO FETCH LATEST
      # ============================================================
      - name: 🔍 Detect latest LLVM release
        id: get_llvm
        run: |
          echo "🔎 Fetching latest LLVM release info..."
          LLVM_TAG=$(curl -sL "https://api.github.com/repos/llvm/llvm-project/releases/latest" \
                     | jq -r '.tag_name')
          echo "LLVM_TAG=${LLVM_TAG}" >> $GITHUB_OUTPUT
          echo "✅ Latest LLVM tag: ${LLVM_TAG}"

      - name: 📦 Download LLVM prebuilt
        id: dl_llvm
        run: |
          LLVM_TAG="${{ steps.get_llvm.outputs.LLVM_TAG }}"
          LLVM_VER=$(echo "${LLVM_TAG}" | sed 's/^llvmorg-//')
          echo "📌 LLVM version detected: ${LLVM_VER}"
          
          LLVM_DIR="${TOOLCHAIN_DIR}/clang-${LLVM_VER}"
          mkdir -p "${LLVM_DIR}"
          
          # Coba beberapa mirror LLVM prebuilt
          URL_BASE="https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}"
          for FILE in \
            "clang+llvm-${LLVM_VER}-x86_64-linux-gnu-ubuntu-22.04.tar.xz" \
            "clang+llvm-${LLVM_VER}-x86_64-linux-gnu.tar.xz" \
            "clang+llvm-${LLVM_VER}-x86_64-linux-gnu-ubuntu-20.04.tar.xz"; do
            echo "🌐 Trying: ${FILE}"
            if curl -fsL --retry 3 -o /tmp/llvm.tar.xz "${URL_BASE}/${FILE}"; then
              echo "✅ Downloaded: ${FILE}"
              echo "LLVM_FILE=${FILE}" >> $GITHUB_OUTPUT
              break
            fi
          done
          
          if [ ! -f /tmp/llvm.tar.xz ]; then
            echo "❌ Failed to download any LLVM prebuilt"
            exit 1
          fi
          
          tar -xJf /tmp/llvm.tar.xz -C "${LLVM_DIR}" --strip-components=1
          rm -f /tmp/llvm.tar.xz
          echo "✅ LLVM installed at ${LLVM_DIR}"
          "${LLVM_DIR}/bin/clang" --version | head -3

      # ============================================================
      # 4. ANDROID CROSS COMPILER (GCC)
      # ============================================================
      - name: 📦 Install Android GCC cross-compiler
        run: |
          mkdir -p ${TOOLCHAIN_DIR}/aarch64-linux-android-4.9
          cd ${TOOLCHAIN_DIR}/aarch64-linux-android-4.9
          
          # Gunakan prebuilt GCC untuk android-5.10 (kompatibel 5.10 LTS)
          git clone --depth=1 -b android-5.10 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            .
          echo "✅ aarch64-linux-android-4.9 ready"
          
          # ARM32 cross compiler (opsional, untuk kompatibilitas penuh)
          mkdir -p ${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9
          cd ${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9
          git clone --depth=1 -b android-5.10 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            .

      # ============================================================
      # 5. SETUP PATHS
      # ============================================================
      - name: 🛠️ Setup build environment
        run: |
          LLVM_DIR="${TOOLCHAIN_DIR}/clang-${{ steps.get_llvm.outputs.LLVM_TAG }}"
          LLVM_DIR=$(echo "${LLVM_DIR}" | sed 's/^llvmorg-//')
          
          cat > $GITHUB_WORKSPACE/env.sh <<EOF
          export PATH="${LLVM_DIR}/bin:${TOOLCHAIN_DIR}/aarch64-linux-android-4.9/bin:${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9/bin:\${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export STRIP=llvm-strip
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          EOF
          source $GITHUB_WORKSPACE/env.sh
          
          echo "=== Toolchain verification ==="
          clang --version | head -2
          ${CROSS_COMPILE}gcc --version | head -2
          aarch64-linux-android-ld --version | head -1 || true

      # ============================================================
      # 6. CCACHE
      # ============================================================
      - name: ⚡ Setup ccache
        run: |
          ccache --version
          ccache -M ${CCACHE_MAXSIZE}
          ccache -o compression=true

      # ============================================================
      # 7. APPLY: ReSukiSU
      # ============================================================
      - name: 🧩 Apply ReSukiSU patch
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "🔧 Applying ReSukiSU (branch: ${{ github.event.inputs.resukisu_branch || 'main' }})..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash -s "${{ github.event.inputs.resukisu_branch || 'main' }}"
          echo "✅ ReSukiSU applied"

      # ============================================================
      # 8. APPLY: Susfs
      # ============================================================
      - name: 🛡️ Apply Susfs patch
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "🔧 Applying Susfs (branch: ${{ env.SUSFS_BRANCH:-${{ github.event.inputs.susfs_branch || 'gki-android12-5.10' }} }})..."
          git clone --depth=1 -b "${{ github.event.inputs.susfs_branch || 'gki-android12-5.10' }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs
          cd susfs
          cp -r fs/* ../fs/ 2>/dev/null || true
          cp -r include/* ../include/ 2>/dev/null || true
          # Apply kernel patches
          if ls kernel_patches/*.patch 1> /dev/null 2>&1; then
            for patch in kernel_patches/*.patch; do
              echo "📌 Applying: $patch"
              cd .. && git apply --check "susfs/$patch" 2>/dev/null \
                && git apply "susfs/$patch" \
                || echo "⚠️  Patch $patch may already be applied or conflicts"
            done
          fi
          cd ..
          echo "✅ Susfs applied"

      # ============================================================
      # 9. APPLY: NoMount (dengan input custom commit)
      # ============================================================
      - name: 🪝 Apply NoMount
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          NOMOUNT_REF="${{ github.event.inputs.nomount_commit || 'master' }}"
          echo "🔧 Applying NoMount (ref: ${NOMOUNT_REF})..."
          
          # Clone NoMount dengan ref yang ditentukan
          git clone --depth=1 -b "${NOMOUNT_REF}" \
            https://github.com/maxsteeel/nomount.git nomount 2>/dev/null \
            || git clone https://github.com/maxsteeel/nomount.git nomount
          
          cd nomount
          # Checkout ref spesifik jika bukan default
          if [ "${NOMOUNT_REF}" != "master" ] && [ "${NOMOUNT_REF}" != "main" ]; then
            git fetch --depth=1 origin "${NOMOUNT_REF}" 2>/dev/null || true
            git checkout "${NOMOUNT_REF}" 2>/dev/null || true
          fi
          
          cd ..
          
          # Apply NoMount via official setup script (fallback)
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" \
            | bash -s master
          
          echo "✅ NoMount applied (ref: ${NOMOUNT_REF})"

      # ============================================================
      # 10. APPLY: Re-Kernel (Sakion netlink & ebpf)
      # ============================================================
      - name: 🔗 Apply Re-Kernel (Sakion)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "🔧 Applying Re-Kernel (Sakion, branch: ${{ github.event.inputs.rekernel_branch || 'main' }})..."
          git clone --depth=1 -b "${{ github.event.inputs.rekernel_branch || 'main' }}" \
            https://github.com/Sakion-Team/Re-Kernel.git re-kernel
          
          # Cari dan apply semua patch yang relevan
          if [ -d "re-kernel/patches" ]; then
            for patch in re-kernel/patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "📌 Applying: $patch"
              git apply --check "$patch" 2>/dev/null \
                && git apply "$patch" \
                || echo "⚠️  Skip $patch (already applied / conflict)"
            done
          fi
          
          if [ -d "re-kernel/kernel_patches" ]; then
            for patch in re-kernel/kernel_patches/*.patch; do
              [ -f "$patch" ] || continue
              echo "📌 Applying: $patch"
              git apply --check "$patch" 2>/dev/null \
                && git apply "$patch" \
                || echo "⚠️  Skip $patch (already applied / conflict)"
            done
          fi
          
          # Copy module files jika ada
          if [ -d "re-kernel/netlink" ]; then
            mkdir -p net/sakion_netlink
            cp -r re-kernel/netlink/* net/sakion_netlink/ 2>/dev/null || true
          fi
          if [ -d "re-kernel/ebpf" ]; then
            mkdir -p kernel/sakion_ebpf
            cp -r re-kernel/ebpf/* kernel/sakion_ebpf/ 2>/dev/null || true
          fi
          
          echo "✅ Re-Kernel applied"

      # ============================================================
      # 11. DEFCONFIG SETUP
      # ============================================================
      - name: ⚙️ Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          source $GITHUB_WORKSPACE/env.sh
          
          # Verifikasi defconfig ada
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "❌ Defconfig ${DEFCONFIG} tidak ditemukan!"
            echo "📋 Defconfigs yang tersedia:"
            ls arch/arm64/configs/ | head -30
            exit 1
          fi
          
          echo "📋 Using defconfig: ${DEFCONFIG}"
          
          # Enable ksu/susfs config jika ada
          cat >> arch/arm64/configs/${DEFCONFIG} <<'KEOF'
          # === ReSukiSU / KernelSU ===
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          
          # === Susfs ===
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          
          # === NoMount ===
          CONFIG_NOMOUNT=y
          
          # === Re-Kernel ===
          CONFIG_NETLINK_NETFILTER=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          KEOF
          
          ${{ github.event.inputs.clean_build == 'true' && 'make clean && make mrproper &&' || '' }}
          make ${DEFCONFIG}
          
          # Validasi
          if [ ! -f .config ]; then
            echo "❌ .config tidak ter-generate!"
            exit 1
          fi
          echo "✅ Defconfig generated"

      # ============================================================
      # 12. BUILD KERNEL
      # ============================================================
      - name: 🏗️ Build kernel image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          source $GITHUB_WORKSPACE/env.sh
          
          # Validasi toolchain
          clang --version | head -1
          ${CROSS_COMPILE}gcc --version | head -1
          
          # Set ccache prefix
          if command -v ccache >/dev/null 2>&1; then
            export CC="ccache clang"
            export CXX="ccache clang++"
          fi
          
          # Build
          echo "🚀 Starting kernel build..."
          make -j$(nproc) \
            CC="ccache clang" \
            CROSS_COMPILE="ccache ${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="ccache arm-linux-androideabi-" \
            LLVM=1 \
            2>&1 | tee build.log | grep -E "Image|^make|error:|warning:" || true
          
          BUILD_RESULT=${PIPESTATUS[0]}
          if [ $BUILD_RESULT -ne 0 ]; then
            echo "❌ Build gagal! Tail dari build.log:"
            tail -100 build.log
            exit $BUILD_RESULT
          fi
          echo "✅ Kernel build sukses"

      # ============================================================
      # 13. VERIFY OUTPUT
      # ============================================================
      - name: ✅ Verify kernel image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo "📦 Output files:"
          ls -lh arch/arm64/boot/
          
          # Pilih image yang sesuai
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ${GITHUB_WORKSPACE}/Image
            echo "✅ Image: $(stat -c%s arch/arm64/boot/Image) bytes"
          fi
          
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb ${GITHUB_WORKSPACE}/Image.gz-dtb
            echo "✅ Image.gz-dtb: $(stat -c%s arch/arm64/boot/Image.gz-dtb) bytes"
          fi
          
          if [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz ${GITHUB_WORKSPACE}/Image.gz
            echo "✅ Image.gz: $(stat -c%s arch/arm64/boot/Image.gz) bytes"
          fi
          
          # DTBs
          if [ -d arch/arm64/boot/dts ]; then
            mkdir -p ${GITHUB_WORKSPACE}/dtbs
            find arch/arm64/boot/dts -name "*.dtb" -exec cp {} ${GITHUB_WORKSPACE}/dtbs/ \;
            echo "✅ DTBs: $(ls ${GITHUB_WORKSPACE}/dtbs/ | wc -l) files"
          fi
          
          # Hitung SHA1
          IMAGE_SHA1=$(sha1sum ${GITHUB_WORKSPACE}/Image.gz-dtb 2>/dev/null \
            || sha1sum ${GITHUB_WORKSPACE}/Image 2>/dev/null \
            || sha1sum ${GITHUB_WORKSPACE}/Image.gz 2>/dev/null \
            | awk '{print $1}')
          echo "IMAGE_SHA1=${IMAGE_SHA1}" >> $GITHUB_ENV
          echo "🔐 SHA1: ${IMAGE_SHA1}"

      # ============================================================
      # 14. PACKAGE AnyKernel3
      # ============================================================
      - name: 📦 Package AnyKernel3
        if: ${{ github.event.inputs.upload_anykernel3 == 'true' }}
        run: |
          echo "📥 Cloning AnyKernel3..."
          git clone --depth=1 https://github.com/yudharn/AnyKernel3.git ${GITHUB_WORKSPACE}/AnyKernel3
          cd ${GITHUB_WORKSPACE}/AnyKernel3
          
          # Set SHA1
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" AnyKernel3/anykernel.sh
          # Fallback jika struktur AnyKernel3 berbeda
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" anykernel.sh 2>/dev/null || true
          
          # Copy kernel image
          cd ${GITHUB_WORKSPACE}/AnyKernel3
          if [ -f ${GITHUB_WORKSPACE}/Image.gz-dtb ]; then
            cp ${GITHUB_WORKSPACE}/Image.gz-dtb zImage
          elif [ -f ${GITHUB_WORKSPACE}/Image.gz ]; then
            cp ${GITHUB_WORKSPACE}/Image.gz zImage
          else
            cp ${GITHUB_WORKSPACE}/Image zImage
          fi
          
          # Copy DTB
          if [ -d ${GITHUB_WORKSPACE}/dtbs ]; then
            cp -r ${GITHUB_WORKSPACE}/dtbs/* . 2>/dev/null || true
            mkdir -p dtb
            cp -r ${GITHUB_WORKSPACE}/dtbs/* dtb/ 2>/dev/null || true
          fi
          
          # Update anykernel.sh metadata
          sed -i "s|kernel.string=.*|kernel.string=${KERNEL_NAME} for Poco F5 by @yudharn|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name1=.*|device.name1=marble|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name2=.*|device.name2=Poco F5|" anykernel.sh 2>/dev/null || true
          sed -i "s|device.name3=.*|device.name3=|" anykernel.sh 2>/dev/null || true
          
          # Bersihkan .git
          rm -rf .git .github
          
          # Zip
          ZIP_NAME="${KERNEL_NAME}-PocoF5-marble-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "${GITHUB_WORKSPACE}/${ZIP_NAME}" . -x "*.git*" "*.zip" "README.md"
          
          echo "✅ AnyKernel3 zip created: ${ZIP_NAME}"
          ls -lh ${GITHUB_WORKSPACE}/${ZIP_NAME}

      # ============================================================
      # 15. UPLOAD ARTIFACTS
      # ============================================================
      - name: 📤 Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-marble-${{ env.KERNEL_NAME }}-${{ github.run_id }}
          path: |
            Image
            Image.gz
            Image.gz-dtb
            dtbs/
            *.zip
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 16. CLEANUP
      # ============================================================
      - name: 🧹 Show final summary
        if: always()
        run: |
          echo "============================================"
          echo "📊 BUILD SUMMARY"
          echo "============================================"
          echo "🔧 Kernel: ${KERNEL_NAME}"
          echo "📱 Device: Poco F5 (marble)"
          echo "⚙️ Defconfig: ${DEFCONFIG}"
          echo "🧩 ReSukiSU: ${{ github.event.inputs.resukisu_branch || 'main' }}"
          echo "🛡️ Susfs: ${{ github.event.inputs.susfs_branch || 'gki-android12-5.10' }}"
          echo "🪝 NoMount: ${{ github.event.inputs.nomount_commit || 'master' }}"
          echo "🔗 Re-Kernel: ${{ github.event.inputs.rekernel_branch || 'main' }}"
          echo "🔐 SHA1: ${IMAGE_SHA1}"
          echo "============================================"
