name: Aetherium Marble Latest

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "Custom kernel name"
        required: true
        default: "Aetherium"
      UPSTREAM_TAG:
        description: "Google upstream tag to merge (leave empty to skip merge)"
        required: false
        default: ""
      MERGE_STRATEGY:
        description: "How to handle merge conflicts"
        required: true
        type: choice
        options:
          - "theirs-auto"
          - "ours-auto"
          - "fail-on-conflict"
        default: "theirs-auto"
      ENABLE_KERNELSU:
        description: "Enable ReSukiSU (Root)"
        required: true
        type: boolean
        default: true
      ENABLE_SUSFS:
        description: "Patch SuSFS for ReSukiSU"
        required: true
        type: boolean
        default: true
      ENABLE_NOMOUNT:
        description: "Enable NoMount (VFS path injection)"
        required: true
        type: boolean
        default: true
      NOMOUNT_REF:
        description: "NoMount commit/branch (leave empty for master)"
        required: false
        default: "master"
      ENABLE_REKERNEL:
        description: "Enable Re-Kernel (netlink & eBPF)"
        required: true
        type: boolean
        default: true
      LTO_TYPE:
        description: "LTO type"
        required: false
        type: choice
        options:
          - "thin"
          - "full"
          - "none"
        default: "thin"
      ENABLE_BBRV3:
        description: "Patch BBRv3 (TCP Congestion)"
        required: true
        type: boolean
        default: false
      ENABLE_DROIDSPACES:
        description: "Patch Droidspaces (LXC)"
        required: true
        type: boolean
        default: false
      ENABLE_LZ4KD:
        description: "Patch LZ4KD (ZRAM)"
        required: true
        type: boolean
        default: false
      ENABLE_NTSYNC:
        description: "Patch NTSYNC"
        required: true
        type: boolean
        default: false
      ENABLE_BLACKLIST:
        description: "X6882 Prank (KSU Spoof)"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "${{ inputs.KERNEL_NAME }} | 5.10 | marble | ${{ inputs.UPSTREAM_TAG || 'no-merge' }} | LLVM"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNEL_NAME: ${{ inputs.KERNEL_NAME || 'Aetherium' }}
      BASE_REPO: "https://github.com/yudharn/Pzqqt-Melt-Rebase"
      BASE_BRANCH: "Yudharn-melt-rebase"
      DEFCONFIG: "marble_defconfig"
      UPSTREAM_TAG: ${{ inputs.UPSTREAM_TAG }}
      MERGE_STRATEGY: ${{ inputs.MERGE_STRATEGY || 'theirs-auto' }}
      ENABLE_KSU: ${{ inputs.ENABLE_KERNELSU }}
      ENABLE_SUSFS: ${{ inputs.ENABLE_SUSFS }}
      ENABLE_NOMOUNT: ${{ inputs.ENABLE_NOMOUNT }}
      NOMOUNT_REF: ${{ inputs.NOMOUNT_REF || 'master' }}
      ENABLE_REKERNEL: ${{ inputs.ENABLE_REKERNEL }}
      LTO: ${{ inputs.LTO_TYPE || 'thin' }}
      ENABLE_BBRV3: ${{ inputs.ENABLE_BBRV3 }}
      ENABLE_DROIDSPACES: ${{ inputs.ENABLE_DROIDSPACES }}
      ENABLE_LZ4KD: ${{ inputs.ENABLE_LZ4KD }}
      ENABLE_NTSYNC: ${{ inputs.ENABLE_NTSYNC }}
      ENABLE_BLACKLIST: ${{ inputs.ENABLE_BLACKLIST }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 python3 \
            python-is-python3 rsync zip unzip jq zstd cpio

      - name: Setup swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure git
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Kernel Builder"
          git config --global color.ui false

      # ──────────────────────────────────────────────
      # 1. Clone base kernel & Tools
      # ──────────────────────────────────────────────
      - name: Clone base kernel
        run: |
          echo "::group::Cloning Luminaire Tools (from aetherium-build)"
          git clone --depth=1 https://github.com/kaminarich/aetherium-build.git luminaire_tools
          echo "::endgroup::"

          echo "::group::Cloning base kernel: $BASE_REPO ($BASE_BRANCH)"
          git clone --branch "$BASE_BRANCH" "$BASE_REPO" kernel
          echo "::endgroup::"
          cd kernel
          echo "Base HEAD: $(git log --oneline -1)"
          echo "Total commits: $(git rev-list --count HEAD)"

      # ──────────────────────────────────────────────
      # 2. Merge upstream Google tag
      # ──────────────────────────────────────────────
      - name: Merge upstream Google tag
        if: inputs.UPSTREAM_TAG != ''
        run: |
          cd kernel

          echo "::group::Adding Google upstream remote"
          git remote add google https://android.googlesource.com/kernel/common
          echo "::endgroup::"

          echo "::group::Fetching upstream tag: $UPSTREAM_TAG"
          git fetch google "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" || {
            echo "::error::Failed to fetch tag $UPSTREAM_TAG from Google. Check if tag exists."
            exit 1
          }
          echo "::endgroup::"

          echo "── Upstream tag info ──"
          git log --oneline -1 "refs/tags/$UPSTREAM_TAG" || true

          echo "::group::Merging upstream tag into base kernel"
          case "$MERGE_STRATEGY" in
            theirs-auto)
              echo "Strategy: Accept upstream changes on conflict (theirs)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X theirs \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: theirs)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (accepting upstream)"
                    git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: theirs)" || true
                }
              ;;
            ours-auto)
              echo "Strategy: Keep our changes on conflict (ours)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X ours \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: ours)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (keeping ours)"
                    git checkout --ours "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: ours)" || true
                }
              ;;
            fail-on-conflict)
              echo "Strategy: Fail if any conflicts"
              git merge "refs/tags/$UPSTREAM_TAG" \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH" || {
                  echo "::error::Merge conflicts detected! Conflicting files:"
                  git diff --name-only --diff-filter=U
                  echo ""
                  echo "::error::Use 'theirs-auto' or 'ours-auto' strategy, or resolve manually."
                  exit 1
                }
              ;;
          esac
          echo "::endgroup::"

          echo "✓ Merge complete"
          echo "Merged HEAD: $(git log --oneline -1)"

      # ──────────────────────────────────────────────
      # 3. Set kernel name
      # ──────────────────────────────────────────────
      - name: Set kernel name
        run: |
          DEFCONFIG_PATH="kernel/arch/arm64/configs/${DEFCONFIG}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG_PATH"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG_PATH"
            echo "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" >> "$DEFCONFIG_PATH"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG_PATH"
            echo "✓ Kernel name: -$KERNEL_NAME"
          else
            echo "::error::Defconfig not found: $DEFCONFIG_PATH"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 4. ReSukiSU Integration
      # ──────────────────────────────────────────────
      - name: Patch ReSukiSU
        if: inputs.ENABLE_KERNELSU == true
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"
          export ROOT_DIR="$GITHUB_WORKSPACE"

          echo "::group::Integrating ReSukiSU"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo "::endgroup::"

          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "" >> "$DEFCONFIG_PATH"
            echo "# ReSukiSU" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_MANUAL_SU=n" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG_PATH"

            echo "" >> "$DEFCONFIG_PATH"
            echo "# Required for KSU" >> "$DEFCONFIG_PATH"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG_PATH"
            echo "✓ ReSukiSU configs added"
          fi

          echo "KSU_VER=ReSukiSU" >> $GITHUB_ENV

          if [ ! -d "drivers/kernelsu" ] && [ ! -d "KernelSU" ]; then
            echo "::error::ReSukiSU integration failed"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 5. SuSFS Integration
      # ──────────────────────────────────────────────
      - name: Patch SuSFS for 5.10
        if: inputs.ENABLE_KERNELSU == true && inputs.ENABLE_SUSFS == true
        run: |
          cd kernel

          echo "::group::Integrating SuSFS for 5.10"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 sus
          rm -rf sus/.git
          susfs="sus/kernel_patches"
          cp -r "$susfs/fs" .
          cp -r "$susfs/include" .
          cp -r "$susfs/50_add_susfs_in_gki-android12-5.10.patch" .
          patch -p1 --batch < 50_add_susfs_in_gki-android12-5.10.patch || {
            echo "::warning::SuSFS patch had issues applying cleanly, some hunks may have failed or already been applied."
          }

          echo "::group::Fixing set_nameidata in fs/namei.c"
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' fs/namei.c
          echo "::endgroup::"
          echo "::endgroup::"

          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG_PATH"
            echo "✓ SuSFS configs added"
          fi

          echo "SUSFS_STATUS=Enabled" >> $GITHUB_ENV

      - name: Fix susfs statfs forward declarations
        if: inputs.ENABLE_KERNELSU == true && inputs.ENABLE_SUSFS == true
        run: bash "$GITHUB_WORKSPACE/scripts/fix-susfs-statfs.sh"
        working-directory: kernel

      # ──────────────────────────────────────────────
      # 6. NoMount Integration
      # ──────────────────────────────────────────────
      - name: Patch NoMount
        if: inputs.ENABLE_NOMOUNT == true
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"

          NOMOUNT_REF="${{ inputs.NOMOUNT_REF || 'master' }}"
          echo "::group::Integrating NoMount (ref: $NOMOUNT_REF)"
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_REF}/kernel/setup.sh" | bash -s "$NOMOUNT_REF"
          echo "::endgroup::"

          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_PATH"
            echo "✓ NoMount config added"
          fi
          echo "NOMOUNT_STATUS=Enabled" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # 7. Re-Kernel Integration (Netlink & eBPF)
      # ──────────────────────────────────────────────
      - name: Patch Re-Kernel
        if: inputs.ENABLE_REKERNEL == true
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"

          echo "::group::Cloning Re-Kernel"
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git re-kernel-src
          echo "::endgroup::"

          echo "::group::Applying Re-Kernel netlink & eBPF patches"
          if [ -f "re-kernel-src/Integrate/apply.sh" ]; then
            bash "re-kernel-src/Integrate/apply.sh" || {
              echo "::warning::Re-Kernel integrate script had issues, attempting manual patch..."
            }
          else
            echo "::warning::Re-Kernel integrate script not found, attempting manual file copy..."
            if [ -d "re-kernel-src/eBPF-Source" ]; then
              cp -r "re-kernel-src/eBPF-Source" ./re-kernel-ebpf
              echo "✓ eBPF-Source copied"
            fi
          fi
          echo "::endgroup::"

          DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG}"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_RE_KERNEL=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_RE_KERNEL_EBPF=y" >> "$DEFCONFIG_PATH"
            echo "✓ Re-Kernel configs added"
          fi
          echo "REKERNEL_STATUS=Enabled" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # X. Apply Optimization Addons
      # ──────────────────────────────────────────────
      - name: Apply Optimization Addons
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"
          export KERNEL_VERSION="5.10"
          export LUMINAIRE_PATCH_DIR="$GITHUB_WORKSPACE"
          export ROOT_DIR="$GITHUB_WORKSPACE"

          echo "::group::Mempersiapkan Lingkungan Addons secara Otomatis"
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/addons/|/add-on/addons/|g' {} +
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/patches/|/add-on/patches/|g' {} +

          sed -i 's/^KABI_PATCH=.*/KABI_PATCH="$LUMINAIRE_PATCH_DIR\/add-on\/patches\/001_GKI-below-6_12-fix_sysvipc_kabi_6_7_8.patch"/g' "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh" 2>/dev/null || true

          sed -i 's|/zram_patch/6.1/|/zram_patch/${KERNEL_VERSION}/|g' "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh" 2>/dev/null || true

          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/curl -LSs /curl -LSs -m 15 /g' {} +

          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/patch -p1/patch -p1 --batch/g' {} +
          echo "::endgroup::"

          function log() { echo "✅ $1"; }
          export -f log
          function error() { echo "❌ $1"; exit 1; }
          export -f error
          function warn() { echo "⚠️ $1"; }
          export -f warn

          if [ "${{ inputs.ENABLE_BLACKLIST }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/blacklist/blacklist.sh"
          fi
          if [ "${{ inputs.ENABLE_BBRV3 }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/bbrv3/bbrv3.sh"
          fi
          if [ "${{ inputs.ENABLE_DROIDSPACES }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh"
          fi
          if [ "${{ inputs.ENABLE_LZ4KD }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh"
          fi
          if [ "${{ inputs.ENABLE_NTSYNC }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/ntsync/ntsync.sh"
          fi

      # ──────────────────────────────────────────────
      # 8. Download latest LLVM toolchain & Build
      # ──────────────────────────────────────────────
      - name: Download latest LLVM Clang toolchain
        run: |
          echo "::group::Fetching latest LLVM release tag"
          LLVM_TAG=$(curl -s -L -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/llvm/llvm-project/releases/latest | jq -r '.tag_name')
          echo "Latest LLVM tag: $LLVM_TAG"
          echo "LLVM_TAG=$LLVM_TAG" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "::group::Downloading LLVM $LLVM_TAG"
          LLVM_VER=$(echo "$LLVM_TAG" | sed 's/^llvmorg-//' | cut -d'.' -f1)
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/clang+llvm-${LLVM_VER}.0.0-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          curl -L -o llvm.tar.xz "$LLVM_URL" || {
            echo "::warning::Primary URL failed, trying generic Linux build..."
            LLVM_URL="https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/LLVM-${LLVM_VER}.0.0-Linux-X64.tar.xz"
            curl -L -o llvm.tar.xz "$LLVM_URL"
          }
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          tar -xf llvm.tar.xz -C "$GITHUB_WORKSPACE/toolchain" --strip-components=1
          echo "::endgroup::"

          echo "Clang version:"
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -2
          echo "CLANG_VER=LLVM $LLVM_TAG" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/dist"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          export KBUILD_BUILD_USER="aetherium"
          export KBUILD_BUILD_HOST="kaminarich"

          echo "::group::Configuring (${DEFCONFIG})"
          make O=out ${DEFCONFIG}
          echo "::endgroup::"

          case "$LTO" in
            thin)
              echo "::group::Applying LTO=thin"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_THIN \
                -d LTO_NONE -d LTO_CLANG_FULL
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
            full)
              echo "::group::Applying LTO=full"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_FULL \
                -d LTO_NONE -d LTO_CLANG_THIN
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
          esac

          echo "::group::Compiling kernel"
          set -o pipefail
          make O=out -j"$(nproc --all)" Image 2>&1 | tee build.log || {
            echo "::error::Build failed! Check build.log."
            exit 1
          }
          echo "::endgroup::"

          cp out/arch/arm64/boot/Image* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

          echo "── Build output ──"
          ls -lh "$GITHUB_WORKSPACE/dist/"

          if [ -f out/include/generated/utsrelease.h ]; then
            KVER=$(grep UTS_RELEASE out/include/generated/utsrelease.h | cut -d'"' -f2)
            echo "Kernel version: $KVER"
            echo "KVER=$KVER" >> $GITHUB_ENV
          else
            echo "KVER=Unknown" >> $GITHUB_ENV
          fi

      # ──────────────────────────────────────────────
      # 9. Package with AnyKernel3 (yudharn/AnyKernel3)
      # ──────────────────────────────────────────────
      - name: Package with AnyKernel3
        id: artifacts
        run: |
          echo "::group::Packaging with yudharn/AnyKernel3"
          git clone --depth=1 https://github.com/yudharn/AnyKernel3.git anykernel

          if [ ! -f "$GITHUB_WORKSPACE/dist/Image" ]; then
            echo "::error::Image not found, cannot pack AnyKernel3"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/dist/Image" anykernel/Image

          IMAGE_SHA1=$(sha1sum "$GITHUB_WORKSPACE/dist/Image" | cut -d' ' -f1)
          echo "Image SHA1: $IMAGE_SHA1"
          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" anykernel/anykernel.sh

          KSU_TAG=""
          if [ "$ENABLE_KSU" = "true" ]; then
            KSU_TAG="-ReSukiSU"
            if [ "$ENABLE_SUSFS" = "true" ]; then
              KSU_TAG="${KSU_TAG}-SuSFS"
            fi
          fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            KSU_TAG="${KSU_TAG}-NoMount"
          fi
          if [ "$ENABLE_REKERNEL" = "true" ]; then
            KSU_TAG="${KSU_TAG}-ReKernel"
          fi

          UPSTREAM_LABEL="${UPSTREAM_TAG:-base-only}"
          BUILD_NAME="${KERNEL_NAME}-marble-5.10-${UPSTREAM_LABEL}${KSU_TAG}-LLVM"
          DATE_TAG=$(date +%Y%m%d)
          ZIP_NAME="${BUILD_NAME}-${DATE_TAG}-${GITHUB_RUN_NUMBER}"

          cd anykernel
          zip -r9 "../dist/${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # ──────────────────────────────────────────────
      # 10. Upload & Release to GitHub
      # ──────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          compression-level: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: "${{ steps.artifacts.outputs.build_name }}"
          body: |
            ## 🔧 ${{ inputs.KERNEL_NAME }} — Poco F5 (marble) 5.10 Kernel

            | Property | Value |
            |----------|-------|
            | **Kernel** | ${{ env.KVER }} |
            | **Device** | Poco F5 (marble) |
            | **Base Source** | [Yudharn-melt-rebase](https://github.com/yudharn/Pzqqt-Melt-Rebase) |
            | **Defconfig** | ${{ env.DEFCONFIG }} |
            | **Upstream Merged** | ${{ inputs.UPSTREAM_TAG || 'none' }} |
            | **Compiler** | ${{ env.CLANG_VER }} |
            | **Root Manager** | ${{ env.KSU_VER }} |
            | **SuSFS** | ${{ env.SUSFS_STATUS }} |
            | **NoMount** | ${{ env.NOMOUNT_STATUS }} (ref: ${{ env.NOMOUNT_REF }}) |
            | **Re-Kernel** | ${{ env.REKERNEL_STATUS }} |
