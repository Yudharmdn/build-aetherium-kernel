name: Aetherium Marble

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "Custom kernel name"
        required: true
        default: "Aetherium"
      BASE_REPO:
        description: "Kernel source repo (default: kernel marble milik Yudharn)"
        required: true
        default: "https://github.com/yudharn/Pzqqt-Melt-Rebase"
      BASE_BRANCH:
        description: "Base repo branch"
        required: true
        default: "Yudharn-melt-rebase"
      UPSTREAM_TAG:
        description: "Google upstream tag to merge (leave empty to skip merge)"
        required: false
        default: ""
      MERGE_STRATEGY:
        description: "How to handle merge conflicts"
        required: true
        type: choice
        options:
          - "theirs-auto"
          - "ours-auto"
          - "fail-on-conflict"
        default: "theirs-auto"
      ENABLE_ROOT:
        description: "Enable Root (ReSukiSU)"
        required: true
        type: boolean
        default: true
      RESUKISU_BRANCH:
        description: "ReSukiSU branch/commit/tag (kosongkan untuk default main)"
        required: false
        default: ""
      ENABLE_SUSFS:
        description: "Patch SuSFS for ReSukiSU"
        required: true
        type: boolean
        default: true
      ENABLE_NOMOUNT:
        description: "Patch NoMount"
        required: true
        type: boolean
        default: true
      NOMOUNT_COMMIT:
        description: "NoMount commit/branch/tag"
        required: false
        default: "master"
      ENABLE_REKERNEL:
        description: "Patch Re-Kernel (Netlink, drivers/rekernel)"
        required: true
        type: boolean
        default: true
      ENABLE_REKERNEL_EBPF:
        description: "Build Re-Kernel eBPF daemon (butuh lib aarch64-android yang di-vendor manual, otomatis skip jika belum ada)"
        required: true
        type: boolean
        default: true
      LTO_TYPE:
        description: "LTO type"
        required: false
        type: choice
        options:
          - "thin"
          - "full"
          - "none"
        default: "thin"
      ENABLE_BBRV3:
        description: "Patch BBRv3 (TCP Congestion)"
        required: true
        type: boolean
        default: false
      ENABLE_DROIDSPACES:
        description: "Patch Droidspaces (LXC)"
        required: true
        type: boolean
        default: false
      ENABLE_LZ4KD:
        description: "Patch LZ4KD (ZRAM)"
        required: true
        type: boolean
        default: false
      ENABLE_NTSYNC:
        description: "Patch NTSYNC"
        required: true
        type: boolean
        default: false
      ENABLE_BLACKLIST:
        description: "X6882 Prank (KSU Spoof)"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "${{ inputs.KERNEL_NAME }} | 5.10 | ${{ inputs.UPSTREAM_TAG || 'no-merge' }} | Marble"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNEL_NAME: ${{ inputs.KERNEL_NAME || 'Aetherium' }}
      BASE_REPO: ${{ inputs.BASE_REPO }}
      BASE_BRANCH: ${{ inputs.BASE_BRANCH || 'Yudharn-melt-rebase' }}
      UPSTREAM_TAG: ${{ inputs.UPSTREAM_TAG }}
      MERGE_STRATEGY: ${{ inputs.MERGE_STRATEGY || 'theirs-auto' }}
      ENABLE_KSU: ${{ inputs.ENABLE_ROOT }}
      ENABLE_SUSFS: ${{ inputs.ENABLE_SUSFS }}
      LTO: ${{ inputs.LTO_TYPE || 'thin' }}
      ENABLE_BBRV3: ${{ inputs.ENABLE_BBRV3 }}
      ENABLE_DROIDSPACES: ${{ inputs.ENABLE_DROIDSPACES }}
      ENABLE_LZ4KD: ${{ inputs.ENABLE_LZ4KD }}
      ENABLE_NTSYNC: ${{ inputs.ENABLE_NTSYNC }}
      ENABLE_BLACKLIST: ${{ inputs.ENABLE_BLACKLIST }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 python3 \
            python-is-python3 rsync zip unzip jq zstd

      - name: Setup swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure git
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Kernel Builder"
          git config --global color.ui false

      - name: Initialize build status defaults
        run: |
          echo "KSU_VER=Disabled" >> $GITHUB_ENV
          echo "SUSFS_STATUS=Disabled" >> $GITHUB_ENV
          echo "NOMOUNT_STATUS=Disabled" >> $GITHUB_ENV
          echo "REKERNEL_STATUS=Disabled" >> $GITHUB_ENV
          echo "REKERNEL_EBPF_STATUS=Disabled" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # 1. Clone base kernel
      # ──────────────────────────────────────────────
      - name: Clone base kernel
        run: |
          echo "::group::Cloning base kernel: $BASE_REPO ($BASE_BRANCH)"
          git clone --branch "$BASE_BRANCH" "$BASE_REPO" kernel
          echo "::endgroup::"
          cd kernel
          echo "Base HEAD: $(git log --oneline -1)"
          echo "Total commits: $(git rev-list --count HEAD)"

      # ──────────────────────────────────────────────
      # 2. Merge upstream Google tag
      # ──────────────────────────────────────────────
      - name: Merge upstream Google tag
        if: inputs.UPSTREAM_TAG != ''
        run: |
          cd kernel

          echo "::group::Adding Google upstream remote"
          git remote add google https://android.googlesource.com/kernel/common
          echo "::endgroup::"

          echo "::group::Fetching upstream tag: $UPSTREAM_TAG"
          git fetch google "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" || {
            echo "::error::Failed to fetch tag $UPSTREAM_TAG from Google. Check if tag exists."
            exit 1
          }
          echo "::endgroup::"

          echo "── Upstream tag info ──"
          git log --oneline -1 "refs/tags/$UPSTREAM_TAG" || true

          echo "::group::Merging upstream tag into base kernel"
          case "$MERGE_STRATEGY" in
            theirs-auto)
              echo "Strategy: Accept upstream changes on conflict (theirs)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X theirs \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: theirs)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (accepting upstream)"
                    git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: theirs)" || true
                }
              ;;
            ours-auto)
              echo "Strategy: Keep our changes on conflict (ours)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X ours \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: ours)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (keeping ours)"
                    git checkout --ours "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: ours)" || true
                }
              ;;
            fail-on-conflict)
              echo "Strategy: Fail if any conflicts"
              git merge "refs/tags/$UPSTREAM_TAG" \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH" || {
                  echo "::error::Merge conflicts detected! Conflicting files:"
                  git diff --name-only --diff-filter=U
                  echo ""
                  echo "::error::Use 'theirs-auto' or 'ours-auto' strategy, or resolve manually."
                  exit 1
                }
              ;;
          esac
          echo "::endgroup::"

          echo "✓ Merge complete"
          echo "Merged HEAD: $(git log --oneline -1)"

      # ──────────────────────────────────────────────
      # 3. Set kernel name
      # ──────────────────────────────────────────────
      - name: Set kernel name
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/marble_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" >> "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
            echo "✓ Kernel name: -$KERNEL_NAME"
          else
            echo "::warning::$DEFCONFIG tidak ditemukan"
          fi

      # ──────────────────────────────────────────────
      # 4. Patch Root Manager (ReSukiSU) & SuSFS
      # ──────────────────────────────────────────────
      - name: Patch Root Manager (ReSukiSU)
        if: env.ENABLE_KSU == 'true'
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"

          echo "::group::Integrating ReSukiSU"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s -- "${{ inputs.RESUKISU_BRANCH }}"
          echo "::endgroup::"

          if [ ! -d "drivers/kernelsu" ] && [ ! -d "KernelSU" ]; then
            echo "::error::ReSukiSU integration failed"
            exit 1
          fi

          DEFCONFIG="arch/arm64/configs/marble_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "" >> "$DEFCONFIG"
            echo "# ReSukiSU" >> "$DEFCONFIG"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y" >> "$DEFCONFIG"
            echo "✓ ReSukiSU base config added"
          fi

          echo "KSU_VER=ReSukiSU" >> $GITHUB_ENV
          cd ..

      - name: Patch SuSFS for 5.10 (ReSukiSU)
        if: env.ENABLE_KSU == 'true' && inputs.ENABLE_SUSFS == true
        run: |
          cd kernel

          echo "::group::Integrating SuSFS for 5.10"
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          susfs="sus/kernel_patches"
          cp -r "$susfs/fs" .
          cp -r "$susfs/include" .
          cp -r "$susfs/50_add_susfs_in_gki-android12-5.10.patch" .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || {
            echo "::warning::SuSFS patch had issues applying cleanly, some hunks may have failed or already been applied."
          }

          echo "::group::Fixing set_nameidata in fs/namei.c"
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' fs/namei.c
          echo "::endgroup::"
          echo "::endgroup::"
          sed -i '1i #include <linux/security.h>' ../fs/susfs.c           

          DEFCONFIG="arch/arm64/configs/marble_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            # Di ReSukiSU, SuSFS ("SUSFS Inline Hook") adalah salah satu opsi pada
            # choice group "KernelSU Hooking Method" -> pastikan pilihan hook lama
            # (tracepoint/manual) tidak ikut nyangkut di defconfig.
            sed -i '/^CONFIG_KSU_TRACEPOINT_HOOK=/d' "$DEFCONFIG"
            sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' "$DEFCONFIG"

            echo "" >> "$DEFCONFIG"
            echo "# SuSFS (ReSukiSU inline hook)" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
            echo "✓ SuSFS configs added (ReSukiSU symbol set)"
          fi

          echo "SUSFS_STATUS=Enabled" >> $GITHUB_ENV

      - name: Fix susfs statfs forward declarations
        if: env.ENABLE_KSU == 'true' && inputs.ENABLE_SUSFS == true
        run: bash "$GITHUB_WORKSPACE/scripts/fix-susfs-statfs.sh"
        working-directory: kernel

      # ──────────────────────────────────────────────
      # 4b. Patch NoMount
      # ──────────────────────────────────────────────
      - name: Patch NoMount
        if: inputs.ENABLE_NOMOUNT == true
        run: |
          cd kernel

          echo "::group::Integrating NoMount (${{ inputs.NOMOUNT_COMMIT || 'master' }})"
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash -s -- "${{ inputs.NOMOUNT_COMMIT || 'master' }}"
          echo "::endgroup::"

          DEFCONFIG="arch/arm64/configs/marble_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "" >> "$DEFCONFIG"
            echo "# NoMount" >> "$DEFCONFIG"
            echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG"
            echo "✓ NoMount config added"
          fi

          echo "NOMOUNT_STATUS=Enabled" >> $GITHUB_ENV
          cd ..

      # ──────────────────────────────────────────────
      # 4c. Patch Re-Kernel (Netlink + eBPF)
      # ──────────────────────────────────────────────
      - name: Patch Re-Kernel (Netlink)
        if: inputs.ENABLE_REKERNEL == true
        run: |
          echo "::group::Cloning Re-Kernel"
          git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git rekernel_src
          echo "::endgroup::"

          cd kernel

          echo "::group::Menjalankan Integrate/patches.sh (netlink -> drivers/rekernel)"
          bash "$GITHUB_WORKSPACE/rekernel_src/Integrate/patches.sh"
          echo "::endgroup::"

          if [ ! -d "drivers/rekernel" ]; then
            echo "::error::Re-Kernel netlink integration gagal (drivers/rekernel tidak ditemukan)"
            exit 1
          fi

          # patches.sh menulis CONFIG_REKERNEL* ke arch/arm64/configs/defconfig
          # (nama file generik bawaan proyek Re-Kernel); kernel ini pakai
          # marble_defconfig, jadi di-set manual di sini supaya benar2 kebawa build.
          DEFCONFIG="arch/arm64/configs/marble_defconfig"
          if [ -f "$DEFCONFIG" ] && ! grep -q '^CONFIG_REKERNEL=' "$DEFCONFIG"; then
            echo "" >> "$DEFCONFIG"
            echo "# Re-Kernel (Netlink)" >> "$DEFCONFIG"
            echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"
            echo "CONFIG_REKERNEL_NETWORK=n" >> "$DEFCONFIG"
            echo "✓ Re-Kernel netlink config added"
          fi

          echo "REKERNEL_STATUS=Netlink" >> $GITHUB_ENV
          cd ..

      - name: Build Re-Kernel eBPF daemon (opsional)
        if: inputs.ENABLE_REKERNEL_EBPF == true
        run: |
          EBPF_SRC="$GITHUB_WORKSPACE/rekernel_src/eBPF-Source"
          VENDOR_DIR="$GITHUB_WORKSPACE/kernel/rekernel-ebpf-libs"
          LIB_DIR="$VENDOR_DIR/aarch64"

          if [ ! -d "$GITHUB_WORKSPACE/rekernel_src" ]; then
            echo "::warning::Re-Kernel belum ter-clone (ENABLE_REKERNEL mati?). Melewati build eBPF."
            exit 0
          fi

          if [ ! -f "$LIB_DIR/libbpf.a" ] || [ ! -f "$LIB_DIR/libelf.a" ] || [ ! -f "$LIB_DIR/libzstd.a" ]; then
            echo "::warning::Melewati build Re-Kernel eBPF: static lib aarch64-android (libbpf.a, libelf.a, libzstd.a) belum di-vendor di kernel/rekernel-ebpf-libs/aarch64/. Taruh ketiga file itu di sana (plus vmlinux.h hasil 'bpftool btf dump file vmlinux.btf format c' dari device marble di kernel/rekernel-ebpf-libs/vmlinux.h, jika beda dari bawaan) untuk mengaktifkan langkah ini."
            exit 0
          fi

          echo "::group::Menyiapkan Android NDK r27d"
          curl -LSs -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          unzip -q /tmp/ndk.zip -d "$HOME"
          rm -f /tmp/ndk.zip
          echo "::endgroup::"

          echo "::group::Membangun rekerneld + rekernel.bpf.o"
          mkdir -p "$EBPF_SRC/lib/aarch64"
          cp "$LIB_DIR"/*.a "$EBPF_SRC/lib/aarch64/"
          if [ -f "$VENDOR_DIR/vmlinux.h" ]; then
            cp "$VENDOR_DIR/vmlinux.h" "$EBPF_SRC/include/vmlinux.h"
          fi
          make -C "$EBPF_SRC" NDK_PATH="$HOME/android-ndk-r27d"
          echo "::endgroup::"

          mkdir -p "$GITHUB_WORKSPACE/dist/rekernel-ebpf"
          cp "$EBPF_SRC/out/rekerneld_aarch64" "$EBPF_SRC/out/rekernel.bpf.o" "$GITHUB_WORKSPACE/dist/rekernel-ebpf/"
          echo "REKERNEL_EBPF_STATUS=Built" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # X. Apply Optimization Addons
      # ──────────────────────────────────────────────
      - name: Apply Optimization Addons
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"
          export KERNEL_VERSION="5.10"
          export LUMINAIRE_PATCH_DIR="$GITHUB_WORKSPACE"
          export ROOT_DIR="$GITHUB_WORKSPACE"

          echo "::group::Mempersiapkan Lingkungan Addons secara Otomatis"
          # 1. Update hardcoded paths dari kernel/ ke add-on/
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/addons/|/add-on/addons/|g' {} +
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/patches/|/add-on/patches/|g' {} +

          # 2. Hancurkan backtick nyasar di droidspaces.sh
          sed -i 's/^KABI_PATCH=.*/KABI_PATCH="$LUMINAIRE_PATCH_DIR\/add-on\/patches\/001_GKI-below-6_12-fix_sysvipc_kabi_6_7_8.patch"/g' "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh" 2>/dev/null || true

          # 3. FIX HARDCODE 6.1 DI LZ4KD.SH! Ubah 6.1 menjadi versi kernel aktual yang dibuild
          sed -i 's|/zram_patch/6.1/|/zram_patch/${KERNEL_VERSION}/|g' "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh" 2>/dev/null || true

          # 4. Mencegah infinite hang: Paksa semua curl agar timeout maksimal 15 detik
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/curl -LSs /curl -LSs -m 15 /g' {} +

          # 5. Mencegah stuck: Paksa semua command patch memakai --batch
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/patch -p1/patch -p1 --batch/g' {} +
          echo "::endgroup::"

          function log() { echo "✅ $1"; }
          export -f log
          function error() { echo "❌ $1"; exit 1; }
          export -f error
          function warn() { echo "⚠️ $1"; }
          export -f warn

          if [ "${{ inputs.ENABLE_BLACKLIST }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/blacklist/blacklist.sh"
          fi
          if [ "${{ inputs.ENABLE_BBRV3 }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/bbrv3/bbrv3.sh"
          fi
          if [ "${{ inputs.ENABLE_DROIDSPACES }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh"
          fi
          if [ "${{ inputs.ENABLE_LZ4KD }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh"
          fi
          if [ "${{ inputs.ENABLE_NTSYNC }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/ntsync/ntsync.sh"
          fi

      # ──────────────────────────────────────────────
      # 5. Download toolchain & Build
      # ──────────────────────────────────────────────
      - name: Download latest official LLVM/Clang toolchain
        run: |
          echo "::group::Resolving rilis LLVM/Clang terbaru"
          LLVM_API="https://api.github.com/repos/llvm/llvm-project/releases/latest"
          LLVM_JSON=$(curl -sL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$LLVM_API")
          LLVM_TAG=$(echo "$LLVM_JSON" | jq -r '.tag_name')
          echo "Rilis terbaru: $LLVM_TAG"

          LLVM_URL=$(echo "$LLVM_JSON" | jq -r '.assets[].browser_download_url' \
            | grep -Ei '/(LLVM-[^/]*-Linux-X64\.tar\.xz|clang\+llvm-[^/]*-x86_64-linux-gnu[^/]*\.tar\.xz)$' \
            | head -n1)

          if [ -z "$LLVM_URL" ]; then
            echo "::error::Tidak menemukan asset Linux x86_64 pada rilis LLVM terbaru ($LLVM_TAG)."
            echo "Daftar asset yang tersedia:"
            echo "$LLVM_JSON" | jq -r '.assets[].name'
            exit 1
          fi
          echo "Toolchain: $LLVM_URL"
          echo "::endgroup::"

          echo "::group::Mengunduh & mengekstrak toolchain"
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          curl -LSs "$LLVM_URL" -o /tmp/llvm-toolchain.tar.xz
          tar -xJf /tmp/llvm-toolchain.tar.xz -C "$GITHUB_WORKSPACE/toolchain" --strip-components=1
          rm -f /tmp/llvm-toolchain.tar.xz
          echo "::endgroup::"

          echo "Clang version:"
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -2

          CLANG_VERSION_STRING=$("$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -1)
          echo "CLANG_VER=$CLANG_VERSION_STRING ($LLVM_TAG)" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/dist"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Stamp the version banner (Linux version ... user@host ...)
          export KBUILD_BUILD_USER="yudharn"
          export KBUILD_BUILD_HOST="meltrebase"

          echo "::group::Configuring (marble_defconfig)"
          make O=out marble_defconfig
          echo "::endgroup::"

          case "$LTO" in
            thin)
              echo "::group::Applying LTO=thin"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_THIN \
                -d LTO_NONE -d LTO_CLANG_FULL
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
            full)
              echo "::group::Applying LTO=full"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_FULL \
                -d LTO_NONE -d LTO_CLANG_THIN
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
          esac

          echo "::group::Compiling kernel"
          set -o pipefail
          make O=out -j"$(nproc --all)" Image 2>&1 | tee build.log || {
            echo "::error::Build failed! Check build.log."
            exit 1
          }
          echo "::endgroup::"

          # Copy output
          cp out/arch/arm64/boot/Image* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

          echo "── Build output ──"
          ls -lh "$GITHUB_WORKSPACE/dist/"

          # Extract kernel version dynamically
          if [ -f out/include/generated/utsrelease.h ]; then
            KVER=$(grep UTS_RELEASE out/include/generated/utsrelease.h | cut -d'"' -f2)
            echo "Kernel version: $KVER"
            echo "KVER=$KVER" >> $GITHUB_ENV
          else
            echo "KVER=Unknown" >> $GITHUB_ENV
          fi

      # ──────────────────────────────────────────────
      # 6. Package with AnyKernel3
      # ──────────────────────────────────────────────
      - name: Package with AnyKernel3
        id: artifacts
        run: |
          echo "::group::Packaging with AnyKernel3 (yudharn/AnyKernel3)"
          git clone --depth=1 https://github.com/yudharn/AnyKernel3

          if [ ! -f "$GITHUB_WORKSPACE/dist/Image" ]; then
            echo "::error::Image not found, cannot pack AnyKernel3"
            exit 1
          fi

          IMAGE_SHA1=$(sha1sum "$GITHUB_WORKSPACE/dist/Image" | cut -d' ' -f1)
          echo "Image SHA1: $IMAGE_SHA1"

          sed -i "s/^SHA1_STOCK=\"0\"/SHA1_STOCK=\"${IMAGE_SHA1}\"/" AnyKernel3/anykernel.sh
          cd AnyKernel3

          cp "$GITHUB_WORKSPACE/dist/Image" Image

          # Sertakan rekerneld + rekernel.bpf.o kalau langkah eBPF di atas berhasil build
          if [ "$REKERNEL_EBPF_STATUS" = "Built" ]; then
            mkdir -p rekernel
            cp "$GITHUB_WORKSPACE/dist/rekernel-ebpf/"* rekernel/
          fi

          KSU_TAG=""
          if [ "$ENABLE_KSU" = "true" ]; then
            KSU_TAG="-ReSukiSU"
            if [ "$ENABLE_SUSFS" = "true" ]; then
              KSU_TAG="${KSU_TAG}-SuSFS"
            fi
          fi

          UPSTREAM_LABEL="${UPSTREAM_TAG:-base-only}"
          BUILD_NAME="${KERNEL_NAME}-5.10-${UPSTREAM_LABEL}${KSU_TAG}-Marble"
          DATE_TAG=$(date +%Y%m%d)
          ZIP_NAME="${BUILD_NAME}-${DATE_TAG}-${GITHUB_RUN_NUMBER}"

          zip -r9 "../dist/${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # ──────────────────────────────────────────────
      # 7. Upload & Release to GitHub
      # ──────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          compression-level: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: "${{ steps.artifacts.outputs.build_name }}"
          body: |
            ## 🔧 ${{ inputs.KERNEL_NAME }} — Android 5.10 GKI Kernel (Marble)

            | Property | Value |
            |----------|-------|
            | **Kernel** | ${{ env.KVER }} |
            | **Base Source** | [${{ inputs.BASE_BRANCH }}](<${{ inputs.BASE_REPO }}>) |
            | **Upstream Merged** | ${{ inputs.UPSTREAM_TAG || 'none' }} |
            | **Compiler** | ${{ env.CLANG_VER }} |
            | **Root Manager** | ${{ env.KSU_VER }} |
            | **SuSFS** | ${{ env.SUSFS_STATUS }} |
            | **NoMount** | ${{ env.NOMOUNT_STATUS }} |
            | **Re-Kernel** | ${{ env.REKERNEL_STATUS }} (eBPF: ${{ env.REKERNEL_EBPF_STATUS }}) |
            | **Build** | #${{ github.run_number }} |

            ### 📥 Flash
            1. Download zip below
            2. Flash via **TWRP / EXKM / FKM** atau KernelSU Manager.
            3. Reboot
          files: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          draft: false
          prerelease: false
          
